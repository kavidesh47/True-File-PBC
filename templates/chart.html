<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True File AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#172a3a; --muted:#708493; --teal:#087f8c; --teal-dark:#075e6a; --paper:#f8fcfb; --line:#dcebe7; }
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; overflow-x:hidden; color:var(--ink); font-family:"DM Sans",sans-serif; background:#eaf6f2; background-image:linear-gradient(135deg,#eaf6f2 0%,#f8f4e9 52%,#d8eef2 100%); }
body::before, body::after { position:fixed; z-index:-1; width:28rem; height:28rem; border-radius:50%; content:""; filter:blur(3px); opacity:.45; animation:drift 14s ease-in-out infinite alternate; }
body::before { top:-10rem; left:-8rem; background:#a9dfd4; }
body::after { right:-10rem; bottom:-12rem; background:#f2d9a7; animation-delay:-5s; }
.page { width:min(1080px,calc(100% - 40px)); min-height:100vh; margin:auto; padding:28px 0; animation:rise .7s ease both; }
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark { display:grid; width:42px; height:42px; place-items:center; border-radius:13px; color:white; font-size:21px; background:var(--teal); box-shadow:0 8px 18px #087f8c33; }
.brand h1 { font:700 19px "Space Grotesk",sans-serif; }
.brand p { margin-top:2px; color:var(--muted); font-size:12px; }
.back-button { display:inline-flex; align-items:center; gap:8px; padding:10px 15px; border:1px solid #c8ded9; border-radius:10px; color:var(--ink); font:600 13px "DM Sans",sans-serif; text-decoration:none; background:#ffffffa8; transition:.25s ease; }
.back-button:hover { color:white; border-color:var(--teal); background:var(--teal); transform:translateX(-3px); }
.workspace { display:grid; grid-template-columns:250px minmax(0,1fr); min-height:660px; overflow:hidden; border:1px solid white; border-radius:22px; background:#ffffffb8; box-shadow:0 25px 70px #1c596022; backdrop-filter:blur(15px); }
.intro { padding:34px 25px; border-right:1px solid var(--line); background:#e8f5f1aa; }
.eyebrow { margin-bottom:18px; color:var(--teal); font-size:11px; font-weight:700; letter-spacing:1.7px; text-transform:uppercase; }
.intro h2 { font:600 29px/1.12 "Space Grotesk",sans-serif; }
.intro h2 span { color:var(--teal); }
.intro-copy { margin:15px 0 32px; color:var(--muted); font-size:14px; line-height:1.6; }
.status { display:flex; align-items:center; gap:9px; padding-top:18px; border-top:1px solid var(--line); color:#4e6b6e; font-size:12px; }
.status i { width:8px; height:8px; border-radius:50%; background:#28a77c; box-shadow:0 0 0 5px #28a77c20; animation:pulse 2s infinite; }
.chat-container { display:flex; min-width:0; flex-direction:column; background:var(--paper); }
.header { display:flex; align-items:center; justify-content:space-between; padding:21px 27px; border-bottom:1px solid var(--line); background:#ffffffa8; }
.header strong { font:600 18px "Space Grotesk",sans-serif; }
.header small { color:var(--muted); font-size:12px; }
.chat-box { flex:1; overflow-y:auto; padding:27px; }
.message { display:flex; margin:0 0 18px; animation:message-in .4s ease both; }
.user { justify-content:flex-end; }
.bubble { max-width:min(73%,500px); padding:14px 17px; border-radius:4px 17px 17px 17px; color:#36505a; font-size:14px; line-height:1.5; background:white; box-shadow:0 5px 20px #305f5910; }
.user .bubble { border-radius:17px 4px 17px 17px; color:white; background:var(--teal); box-shadow:0 7px 18px #087f8c30; }
.typing { color:var(--muted); font-style:italic; }
.typing::after { content:" ..."; animation:dots 1s steps(3,end) infinite; }
.input-area { display:flex; gap:10px; padding:18px 25px 22px; border-top:1px solid var(--line); background:#ffffffa8; }
.input-area input { min-width:0; flex:1; padding:14px 17px; border:1px solid #cfe3de; border-radius:12px; outline:none; color:var(--ink); font:14px "DM Sans",sans-serif; background:white; transition:.2s; }
.input-area input:focus { border-color:var(--teal); box-shadow:0 0 0 4px #087f8c14; }
.input-area button { width:49px; border:0; border-radius:12px; color:white; font-size:20px; cursor:pointer; background:var(--teal); transition:.25s ease; }
.input-area button:hover { background:var(--teal-dark); transform:translateY(-2px); }
@keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes message-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes drift { from { transform:translate(0,0) scale(1); } to { transform:translate(35px,25px) scale(1.08); } }
@keyframes pulse { 50% { box-shadow:0 0 0 8px #28a77c00; } }
@keyframes dots { 0%,20% { content:""; } 40% { content:"."; } 60% { content:".."; } 80%,100% { content:"..."; } }
@media (max-width:700px) { .page { width:min(100% - 24px,540px); padding:16px 0; } .workspace { display:block; min-height:calc(100vh - 100px); border-radius:17px; } .intro { padding:22px; border-right:0; border-bottom:1px solid var(--line); } .intro-copy { margin-bottom:18px; } .header,.chat-box { padding:19px; } .input-area { padding:14px 17px 17px; } .bubble { max-width:86%; } }
</style>
</head>
<body>
<main class="page">
<nav class="topbar" aria-label="Page navigation">
<div class="brand"><div class="brand-mark">✦</div><div><h1>TRUE FILE</h1><p>Document intelligence platform</p></div></div>
<a class="back-button" href="/" aria-label="Return to home page"><span aria-hidden="true">←</span> Back</a>
</nav>
<section class="workspace">
<aside class="intro"><div class="eyebrow">AI support desk</div><h2>Ask with<br><span>confidence.</span></h2><p class="intro-copy">Get clear guidance about document verification, your True Wallet, and the verification ledger.</p><div class="status"><i></i> Assistant online</div></aside>
<section class="chat-container" aria-label="AI chat assistant">
<header class="header"><strong>True AI Assistant</strong><small>Secure conversation</small></header>
<div class="chat-box" id="chatPanel"><div class="message bot"><div class="bubble">Hello! 👋<br>I’m True AI. How can I help you today?</div></div></div>
<div class="input-area"><input type="text" id="message" placeholder="Ask about document verification..." aria-label="Message" onkeypress="if(event.key==='Enter')sendMessage()"><button type="button" onclick="sendMessage()" aria-label="Send message">➤</button></div>
</section>
</section>
</main>
<script>
const chatPanel = document.getElementById("chatPanel");
function addMessage(text, type) { const message = document.createElement("div"); message.className = "message " + type; const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = text; message.appendChild(bubble); chatPanel.appendChild(message); chatPanel.scrollTop = chatPanel.scrollHeight; }
async function sendMessage() { const input = document.getElementById("message"); const text = input.value.trim(); if (!text) return; addMessage(text, "user"); input.value = ""; const typing = document.createElement("div"); typing.className = "message bot"; typing.id = "typing"; typing.innerHTML = '<div class="bubble typing">Thinking</div>'; chatPanel.appendChild(typing); chatPanel.scrollTop = chatPanel.scrollHeight; try { const response = await fetch("/ai-chat/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) }); const data = await response.json(); document.getElementById("typing")?.remove(); if (!response.ok) { addMessage("Unable to answer: " + (data.error || "The AI server returned an error."), "bot"); return; } addMessage(data.reply, "bot"); } catch (error) { document.getElementById("typing")?.remove(); addMessage("Unable to connect to the AI service.", "bot"); } }
</script>
</body>
</html>
